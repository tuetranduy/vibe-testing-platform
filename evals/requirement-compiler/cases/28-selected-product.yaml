id: selected-product
tags: [cart, references]
# KI-001: the live E2E pass case's requirement. "the selected product" is the product the flow opened: a fact read
# on its page, looked for in the cart (collection_contains). V4 Pro compiled it as semantic + ambiguous in 3 of 3
# live runs (2026-10-04), so the cart was never read.
input: Verify that a user can search for an iPhone, add it to the cart, and see the selected product in the cart.
testDataKeys: []
secretNames: []
expect:
  criteriaCount: { min: 1, max: 3 }
  requiredOutcomeKinds:
    - collection_contains
  forbiddenOutcomeKinds: [semantic]
  mustFlagAmbiguous: false
  mustNotFlagAmbiguous: true
  onlyProvidedInputRefs: true
