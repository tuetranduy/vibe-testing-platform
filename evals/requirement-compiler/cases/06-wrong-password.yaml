id: wrong-password
tags: [login, multi-criterion]
input: >-
  Logging in with a wrong password shows the error "Invalid email or password" and the user stays on
  the login page.
testDataKeys: [email]
secretNames: [wrong_password]
expect:
  criteriaCount: { min: 1, max: 3 }
  requiredOutcomeKinds:
    - [text_matches, visible]
  mustFlagAmbiguous: false
