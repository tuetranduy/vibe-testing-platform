id: wrong-password-error
tags: [vague, wording, login]
# FD-06 of the unclear-requirement corpus (KI-070): the requirement says an error is shown, not what it says. A
# text_matches on a guessed message ("Invalid email or password") would fail a working page.
input: Signing in with a wrong password should show an error
testDataKeys: [email]
secretNames: [wrong_password]
expect:
  criteriaCount: { min: 1, max: 3 }
  requiredOutcomeKinds: [visible]
  noInventedText: true
  mustFlagAmbiguous: false
