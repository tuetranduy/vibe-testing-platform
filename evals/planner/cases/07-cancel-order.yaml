id: cancel-order
tags: [destructive, login, blocking, model-flag]
# Input reused from requirement-compiler/cases/08-cancel-order.yaml. The action policy denies
# "cancel order" / "cancel my order" (Ruling R19); other phrasings ("Cancel the order") are blocked
# only if the model marks the step destructive.
testDataKeys: [orderNumber, email]
secretNames: [password]
requirement:
  originalText: Cancelling an open order changes its status to "Cancelled" in the order list.
  criteria:
    - id: AC-1
      sourceText: Cancelling an open order changes its status to "Cancelled" in the order list.
      statement: The cancelled order shows the status Cancelled in the order list
      expectedOutcome:
        kind: collection_contains
        collection: { key: orderStatuses, checkpoint: after_cancel }
        item: Cancelled
        match: contains
      preconditions:
        - { kind: authenticated, description: User is logged in }
        - { kind: test_data, ref: orderNumber, description: The open order to cancel }
      ambiguity: null
  facts:
    - { key: orderStatuses, checkpoint: after_cancel, description: Statuses in the order list, valueType: string_list }
expect:
  blocked:
    - { criterionId: AC-1, reason: DESTRUCTIVE_ACTION_NOT_AUTHORIZED }
