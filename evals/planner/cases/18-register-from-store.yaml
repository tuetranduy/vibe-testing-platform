# KI-048 (run_0muxw7z9b62ec85ca946b2687, demoqa.com/books): the planner, which never saw the site, planned
# "Click the 'New User' button" on the start page; it is only on /login, opened by the "Login" button. The pages are
# demoqa's /books and /login as the survey's inventory script read them on 2026-10-07; the criteria are the run's.
id: register-from-store
tags:
  - login
  - site-pages
targetUrl: https://demoqa.com/books
testDataKeys:
  - newUserUsername
secretNames: []
requirement:
  originalText: go to this page, create new account, then login using that new account, then go to Book Store, go to Git Pocket Guide book and
    add book to collection
  criteria:
    - id: AC-1
      critical: true
      ambiguity: null
      statement: User can create a new account successfully.
      sourceText: create new account
      preconditions:
        - ref: newUserUsername
          kind: test_data
          description: Username/email for the new account
        - ref: newUserPassword
          kind: secret
          description: Password for the new account
      expectedOutcome:
        fact:
          key: registration_success_message
          checkpoint: after_registration
        kind: visible
        expected: true
    - id: AC-2
      critical: true
      ambiguity: null
      statement: User can log in with the newly created account.
      sourceText: login using that new account
      preconditions:
        - ref: newUserUsername
          kind: test_data
          description: Username/email for the new account
        - ref: newUserPassword
          kind: secret
          description: Password for the new account
      expectedOutcome:
        fact:
          key: profile_page_visible
          checkpoint: after_login
        kind: visible
        expected: true
    - id: AC-3
      critical: true
      ambiguity: null
      statement: User can navigate to the Book Store page.
      sourceText: go to Book Store
      preconditions:
        - kind: authenticated
          description: User is logged in
      expectedOutcome:
        fact:
          key: book_store_heading
          checkpoint: book_store_page
        kind: visible
        expected: true
    - id: AC-4
      critical: true
      ambiguity: null
      statement: User can open the Git Pocket Guide book detail page.
      sourceText: go to Git Pocket Guide book
      preconditions:
        - kind: authenticated
          description: User is logged in
      expectedOutcome:
        fact:
          key: book_title
          checkpoint: book_detail_page
        kind: text_matches
        match:
          mode: equals
          value: Git Pocket Guide
          caseSensitive: false
    - id: AC-5
      critical: true
      ambiguity: null
      statement: User can add the Git Pocket Guide book to their collection.
      sourceText: add book to collection
      preconditions:
        - kind: authenticated
          description: User is logged in
      expectedOutcome:
        item: Git Pocket Guide
        kind: collection_contains
        match: contains
        collection:
          key: profile_collection
          checkpoint: profile_page_after_add
  facts:
    - key: registration_success_message
      valueType: boolean
      checkpoint: after_registration
      description: Success message shown after creating account
    - key: profile_page_visible
      valueType: boolean
      checkpoint: after_login
      description: Profile page or welcome message visible after login
    - key: book_store_heading
      valueType: boolean
      checkpoint: book_store_page
      description: Book Store page heading visible
    - key: book_title
      valueType: string
      checkpoint: book_detail_page
      description: Title of the book on the detail page
    - key: profile_collection
      valueType: string_list
      checkpoint: profile_page_after_add
      description: List of books in the user's collection on Profile page
