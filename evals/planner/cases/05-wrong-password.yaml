id: wrong-password
tags: [login]
# Input reused from requirement-compiler/cases/06-wrong-password.yaml.
testDataKeys: [email]
secretNames: [wrong_password]
requirement:
  originalText: >-
    Logging in with a wrong password shows the error "Invalid email or password" and the user stays on
    the login page.
  criteria:
    - id: AC-1
      sourceText: Logging in with a wrong password shows the error "Invalid email or password"
      statement: A wrong password shows the error Invalid email or password
      expectedOutcome:
        kind: text_matches
        fact: { key: loginError, checkpoint: after_login }
        match: { mode: contains, value: Invalid email or password, caseSensitive: false }
      preconditions:
        - { kind: test_data, ref: email, description: Account email }
        - { kind: secret, ref: wrong_password, description: A wrong password }
      ambiguity: null
    - id: AC-2
      sourceText: the user stays on the login page.
      statement: The user stays on the login page after the failed login
      expectedOutcome:
        kind: text_matches
        fact: { key: url, checkpoint: after_login }
        match: { mode: contains, value: login, caseSensitive: false }
      preconditions: []
      ambiguity: null
  facts:
    - { key: loginError, checkpoint: after_login, description: Error message on the login form, valueType: string }
expect:
  requiredStepKinds: [fill, login, capture_checkpoint]
  maxSteps: 10
  blocked: []
  requiresLogin: true
  inputRefs:
    - { source: testData, key: email }
    - { source: secret, key: wrong_password }
