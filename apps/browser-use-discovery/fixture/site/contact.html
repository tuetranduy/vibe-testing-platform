<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Contact - Fixture Tea Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><header><h1>Fixture Tea Shop</h1><nav aria-label="Main"><a href="/">Home</a> | <a href="/products.html">Products</a> | <a href="/cart.html">Cart</a> | <a href="/contact.html">Contact</a> | <a href="/about.html">About</a></nav></header>
<main>
<h2>Contact us</h2>
<form id="contact-form" novalidate>
  <label for="name">Name</label> <input id="name" name="name" required maxlength="60">
  <label for="email">Email</label> <input id="email" name="email" type="email" required>
  <label for="topic">Topic</label> <select id="topic" name="topic"><option value="">Choose a topic</option><option>Order question</option><option>Wholesale</option></select>
  <label for="message">Message</label> <textarea id="message" name="message" required minlength="10" maxlength="500"></textarea>
  <button type="submit">Send message</button>
</form>
<ul id="form-errors" role="alert"></ul>
<p id="form-success" role="status" hidden>Thanks! This fixture does not send messages anywhere.</p>
</main><footer><p>Disposable QA fixture. No real orders, accounts or payments.</p></footer></body></html>
