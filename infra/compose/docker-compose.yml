# Full local stack: `pnpm stack:up` (or `docker compose -f infra/compose/docker-compose.yml up -d --build --wait`).
# Infra only (for running api/worker/web with pnpm on your machine): `pnpm infra:up`.
# Override any ${VAR} below in infra/compose/.env (see .env.example at the repo root).
name: ai-testing-platform

x-app-env: &app-env
  # "development" so the demo shop allowlist and the fake LLM provider are permitted.
  NODE_ENV: development
  DATABASE_URL: postgresql://platform:platform@postgres:5432/platform
  REDIS_URL: redis://redis:6379
  ARTIFACT_STORAGE_TYPE: s3
  ARTIFACT_BUCKET: artifacts
  S3_ENDPOINT: http://s3:9000
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-s3admin}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-s3admin-secret}
  S3_FORCE_PATH_STYLE: "true"
  LLM_PROVIDER: ${LLM_PROVIDER:-fake}
  # Empty: the provider's default model (claude-sonnet-5 / gemini-3.8-flash / deepseek-flash).
  LLM_MODEL: ${LLM_MODEL:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_THINKING_LEVEL: ${GEMINI_THINKING_LEVEL:-}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  BROWSER_MODE: local
  API_TOKEN: ${API_TOKEN:-dev-api-token-change-me-please}
  # The first administrator (created while there are no users). Local-only default: change it.
  BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-admin-password-change-me}
  SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
  API_PORT: "3001"
  API_URL: http://api:3001
  DEFAULT_TENANT_ID: t_default
  # Local-only default. Generate your own: node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
  SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
  TARGET_PRIVATE_ALLOWLIST: demo-shop:4000
  RUN_MIGRATIONS_ON_START: "false"
  LOG_LEVEL: info

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible artifact store for local use (rclone's S3 server).
  # MinIO's images are no longer published on Docker Hub. Any S3-compatible server works here.
  # The api creates the `artifacts` bucket on start-up.
  s3:
    image: rclone/rclone:latest
    command: ["serve", "s3", "--auth-key", "${S3_ACCESS_KEY_ID:-s3admin},${S3_SECRET_ACCESS_KEY:-s3admin-secret}", "--addr", ":9000", "/data"]
    ports: ["9000:9000"]
    volumes: [s3data:/data]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 5s
      timeout: 3s
      retries: 20

  demo-shop:
    build:
      context: ../../tests/fixtures/demo-shop
    environment:
      PORT: "4000"
      DEMO_SHOP_TEST_ENDPOINTS: "1"
    ports: ["4000:4000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ../..
      target: migrate
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build:
      context: ../..
      target: api
    environment:
      <<: *app-env
      # Signed artifact URLs are opened by the host's browser, which can't resolve `s3` (Ruling R54).
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
    ports: ["3001:3001"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      s3: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build:
      context: ../..
      target: worker
    # Chromium keeps its own sandbox on, which needs user namespaces: Docker's default seccomp profile
    # plus user, PID and network namespaces for clone/unshare (infra/seccomp/README.md). No extra
    # capabilities, and never --no-sandbox.
    security_opt: ["seccomp=../seccomp/worker.json"]
    # An init process (PID 1) reaps the helpers of browsers the worker kills and forwards signals.
    init: true
    environment:
      <<: *app-env
      FAKE_ENGINE_STEP_DELAY_MS: "500"
      WORKER_METRICS_PORT: "9464"
      # Reruns run in the runner service (KI-029), on the workspaces volume both mount.
      RUNNER_URL: http://runner:3100
      RUNNER_TOKEN: ${RUNNER_TOKEN:-dev-runner-token-change-me}
      RUNNER_WORKSPACE_DIR: /work/runs
    volumes: ["runs:/work/runs"]
    networks: [default, runner]
    # Metrics are unauthenticated: loopback only, and a random host port per replica so
    # `--scale worker=N` works (`docker compose port --index N worker 9464` finds it).
    ports: ["127.0.0.1::9464"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      s3: { condition: service_healthy }
      runner: { condition: service_healthy }
    restart: unless-stopped

  # The Playwright rerun (KI-029): its own container on the internal `runner` network only — it reaches the
  # workers, never the database, Redis, object storage or the internet. Its browser's traffic goes through the
  # worker's per-rerun egress proxy. Chromium keeps its sandbox on, as in the worker.
  runner:
    build:
      context: ../..
      target: runner
    security_opt: ["seccomp=../seccomp/worker.json"]
    init: true
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN:-dev-runner-token-change-me}
      RUNNER_WORKSPACE_DIR: /work/runs
      LOG_LEVEL: info
    volumes: ["runs:/work/runs"]
    networks: [runner]
    restart: unless-stopped

  web:
    build:
      context: ../..
      target: web
    environment:
      NODE_ENV: production
      API_URL: http://api:3001
      API_TOKEN: ${API_TOKEN:-dev-api-token-change-me-please}
      # The Host names the UI is served on; the API proxy rejects every other Host (DNS rebinding).
      WEB_ALLOWED_HOSTS: ${WEB_ALLOWED_HOSTS:-localhost:3000,127.0.0.1:3000}
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  s3data:
  # Rerun workspaces, shared by the workers and the runner.
  runs:

networks:
  # No gateway: only the workers and the runner are on it.
  runner:
    internal: true
