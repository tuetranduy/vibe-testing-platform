# The worker server: the worker, its isolated Playwright runner and Valkey (Redis). Everything else is managed
# (Supabase, R2, Cloudflare). .github/workflows/deploy.yml copies this file to /opt/vibe-testing and writes the .env beside it.
# Both services use the one worker image; the runner only overrides the command.
name: vibe-testing

services:
  worker:
    image: ${WORKER_IMAGE:?}
    security_opt: ["seccomp=./worker.json"]
    init: true
    env_file: .env
    environment:
      RUNNER_URL: http://runner:3100
      RUNNER_WORKSPACE_DIR: /work/runs
      # Loopback-free: nothing on this server scrapes it, and it must not be published.
      WORKER_METRICS_PORT: "0"
    volumes: ["runs:/work/runs"]
    # discovery and fixture: the Browser Use pilot's private networks (below); the worker is their only other member.
    networks: [default, runner, discovery, fixture]
    # This server is shared with other apps.
    mem_limit: 2g
    depends_on:
      runner: { condition: service_healthy }
      valkey: { condition: service_healthy }
    restart: unless-stopped

  # No gateway on its network: it reaches the workers only, never the database, Redis, storage or the internet.
  runner:
    image: ${WORKER_IMAGE:?}
    command: ["pnpm", "--filter", "@platform/worker", "runner"]
    security_opt: ["seccomp=./worker.json"]
    init: true
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN:?}
      RUNNER_WORKSPACE_DIR: /work/runs
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
    volumes: ["runs:/work/runs"]
    networks: [runner]
    mem_limit: 1g
    restart: unless-stopped

  # Browser Use fixture pilot (BROWSER_USE_DISCOVERY_PRODUCTION=fixture-pilot). The disposable fixture site that the
  # worker's own survey browses, reachable only on the internal `fixture` network.
  browser-use-fixture:
    image: ${BROWSER_USE_AGENT_IMAGE:?}
    entrypoint: ["python", "-P", "-m", "discovery_service.fixture_server", "--host", "0.0.0.0", "--port", "4599"]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4599/', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [fixture]
    mem_limit: 96m
    pids_limit: 32
    restart: unless-stopped

  # The signed job service. It starts each job's agent container on this host's Docker with --network none, a
  # read-only filesystem, no capabilities and a 1 GiB memory cap, brokers its model calls (the only service that
  # holds the model key and the signing token), and is reachable only from the worker on the internal `discovery`
  # network. `discovery-egress` is its own way out, for the model provider.
  browser-use-discovery:
    image: ${BROWSER_USE_BROKER_IMAGE:?}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      DISCOVERY_FIXTURE_URL: http://browser-use-fixture:4599/
      DISCOVERY_MODEL: ${BROWSER_USE_DISCOVERY_MODEL:?}
      DISCOVERY_IMAGE: ${BROWSER_USE_AGENT_IMAGE:?}
      DISCOVERY_AGENT_MEMORY: 1g
      # Live interaction: each job's inspecting egress proxy joins this plain bridge (created by the launcher when
      # missing); the agent container stays on its job's --internal network with the proxy as its only peer.
      DISCOVERY_LIVE_SITES: ${BROWSER_USE_DISCOVERY_LIVE_INTERACTION:-on}
      DISCOVERY_LIVE_EGRESS_NETWORK: vtp-discovery-live-egress
      # public: a live page's requests may reach any public host, so sites whose API is on another domain (a
      # vercel.app front end calling an onrender.com API) work. Opening another site's pages stays blocked, and
      # requests to hosts other than the target stay capped per job.
      DISCOVERY_LIVE_OTHER_HOSTS: public
      # Concurrent agent containers (Phase C multi-agent runs need more than one); matches the worker's capacity.
      DISCOVERY_JOB_SLOTS: ${BROWSER_USE_DISCOVERY_CAPACITY:-1}
      DISCOVERY_SERVICE_TOKEN: ${BROWSER_USE_DISCOVERY_SERVICE_TOKEN:?}
      DISCOVERY_SERVICE_HOST: 0.0.0.0
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4600/internal/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 8
    networks: [discovery, discovery-egress]
    mem_limit: 384m
    pids_limit: 128
    restart: unless-stopped

  # The queues, pub/sub and rate-limit counters. The worker uses the plain port over this project's network; the API
  # (a Cloudflare Container) comes in over the internet on the TLS port, with its own ACL user. The files under
  # ./valkey (ACL with hashed passwords, certificate and key) are written by scripts/deploy/deploy-worker.sh.
  valkey:
    image: valkey/valkey:8.1-alpine
    # As root only to copy the deploy user's 0600 files where the server's user can read them; the image's
    # entrypoint then drops to that user.
    entrypoint: ["sh", "-c", "install -d -o valkey -g valkey -m 700 /run/valkey && install -o valkey -g valkey -m 600 /secrets/users.acl /secrets/server.crt /secrets/server.key /run/valkey/ && exec docker-entrypoint.sh \"$$@\"", "--"]
    command:
      - valkey-server
      - --port
      - "6379"
      - --tls-port
      - "6380"
      - --tls-cert-file
      - /run/valkey/server.crt
      - --tls-key-file
      - /run/valkey/server.key
      - --tls-auth-clients
      - "no"
      - --tls-protocols
      - TLSv1.2 TLSv1.3
      - --aclfile
      - /run/valkey/users.acl
      - --appendonly
      - "yes"
      - --save
      - ""
      # BullMQ needs every key kept: an evicted job or lock is a lost run.
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    ports: ["6380:6380"]
    volumes:
      - ./valkey:/secrets:ro
      - valkey-data:/data
    healthcheck:
      # The default user is off, so an answer of NOAUTH also means the server is up.
      test: ["CMD-SHELL", "valkey-cli ping 2>&1 | grep -qE 'PONG|NOAUTH'"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 384m
    restart: unless-stopped

volumes:
  runs:
  valkey-data:

networks:
  runner:
    internal: true
  discovery:
    internal: true
  fixture:
    internal: true
  discovery-egress: {}
