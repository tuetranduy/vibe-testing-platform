# Every push and pull request: typecheck, unit + DB/Redis tests, the real-Chromium integration tests and the
# CI-mode E2E suite (scripted model and explorer; deterministic, no model key). Nightly and on demand: the live
# E2E suite against the real model (plan, Task 21: "Live mode, nightly + before release"); the release gate
# (3 consecutive green runs) is the `live-gate` input. Live jobs need the GEMINI_API_KEY secret (billed).
name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      live-gate:
        description: "Run the release gate (live E2E suite green 3 times in a row)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # One browser cache for the worker's playwright-core, the rerun's @playwright/test and the demo shop's tests.
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ms-playwright
  S3_TEST_ENDPOINT: http://localhost:9000
  S3_TEST_ACCESS_KEY_ID: s3admin
  S3_TEST_SECRET_ACCESS_KEY: s3admin-secret

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Chromium's sandbox needs unprivileged user namespaces, which Ubuntu 24.04's AppArmor restricts.
      - name: Allow unprivileged user namespaces (Chromium sandbox)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium (exploration, rerun and demo-shop tests)
        run: |
          pnpm --filter @platform/worker exec playwright-core install --with-deps chromium
          cd tests/fixtures/demo-shop && npx playwright install chromium
      - name: Start Postgres, Redis, S3 and the demo shop
        run: pnpm infra:up
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm test:e2e
      - name: Keep the E2E stack's logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: ${{ runner.temp }}/**/*.log
          if-no-files-found: ignore

  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      LLM_PROVIDER: gemini
      LLM_MODEL: ""
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Chromium's sandbox needs unprivileged user namespaces, which Ubuntu 24.04's AppArmor restricts.
      - name: Allow unprivileged user namespaces (Chromium sandbox)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @platform/worker exec playwright-core install --with-deps chromium
      - run: pnpm infra:up
      - name: Live E2E suite (nightly)
        if: ${{ !inputs.live-gate }}
        run: pnpm test:e2e:live
      - name: Release gate (3 consecutive green runs)
        if: ${{ inputs.live-gate }}
        run: ./scripts/e2e-live-gate.sh
